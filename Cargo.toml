[package]
name = "gprx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Exact Gaussian process regression"
repository = "https://github.com/YUKIKEDA/gprx"
homepage = "https://github.com/YUKIKEDA/gprx"
documentation = "https://docs.rs/gprx"
readme = "README.md"
keywords = ["gaussian-process", "gpr", "machine-learning"]
categories = ["science", "mathematics"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "benches/**/*",
    "compare/goldens/**/*",
    "/README.md",
    "/README.ja.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = false

[lints.rust]
missing_docs = "deny"

[features]
# compare/perf `--stages` only. Default `just test` / `just perf-online` stay off.
insert-stages = []
# benches/exact.rs only: exposes `gprx::internals` fills.
bench-internals = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
float_cmp = "deny"
or_fun_call = "deny"

[dependencies]
argmin = { version = "0.11.0", default-features = false }
argmin-math = { version = "0.5.1", default-features = false, features = ["vec"] }
dyn-stack = "0.13"
faer = "0.24.4"
faer-traits = "0.24.0"
memmap2 = "0.9"
rayon = "1.12"
safetensors = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
wide = "0.7"

[dev-dependencies]
criterion = "0.5"
dyn-stack = "0.13"
faer = "0.24.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stats_alloc = "0.1.10"

[[bench]]
name = "exact"
harness = false
required-features = ["bench-internals"]

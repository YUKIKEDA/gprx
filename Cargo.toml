[package]
name = "gprx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Flexible high-performance Gaussian process regression"
repository = "https://github.com/YUKIKEDA/gprx"
readme = "README.md"
keywords = ["gaussian-process", "gpr", "machine-learning"]
categories = ["science", "mathematics"]
publish = false

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
float_cmp = "deny"

[dependencies]
argmin = { version = "0.11.0", default-features = false }
argmin-math = { version = "0.5.1", default-features = false, features = ["vec"] }
dyn-stack = "0.13"
faer = "0.24.4"
thiserror = "2.0.20"

[dev-dependencies]
criterion = "0.5"
dyn-stack = "0.13"
faer = "0.24.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stats_alloc = "0.1.10"

[[bench]]
name = "exact"
harness = false

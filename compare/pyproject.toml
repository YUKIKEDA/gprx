[project]
name = "gprx-compare"
version = "0.0.0"
description = "sklearn / GPyTorch golden generator for gprx. Not a published package."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scikit-learn==1.6.1",
    "scipy>=1.11",
    "torch>=2.4",
    "gpytorch>=1.13",
]

[tool.uv]
package = false

[package]
name = "friedrich-perf"
version = "0.0.0"
edition = "2021"
publish = false
description = "P2B-16 friedrich runner. Not part of the gprx crate."

[dependencies]
friedrich = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
libc = "0.2"

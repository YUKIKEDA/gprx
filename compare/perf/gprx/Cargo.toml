[package]
name = "gprx-perf"
version = "0.0.0"
edition = "2024"
publish = false
description = "gprx runner of the compare/perf harnesses (P2B-16, P3-6, P4-12, P4-14). Not part of the gprx crate."

[[bin]]
name = "gprx-perf"
path = "src/main.rs"

[features]
insert-stages = ["gprx/insert-stages"]
# `fit` mode (B1-1): counts the objective calls of one fit.
fit-counts = ["gprx/bench-internals"]

[dependencies]
gprx = { path = "../../.." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

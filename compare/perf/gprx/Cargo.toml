[package]
name = "gprx-perf"
version = "0.0.0"
edition = "2024"
publish = false
description = "P2B-16 gprx runner. Not part of the gprx crate."

[features]
insert-stages = ["gprx/insert-stages"]

[dependencies]
gprx = { path = "../../.." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

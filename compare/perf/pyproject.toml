[project]
name = "gprx-perf"
version = "0.0.0"
description = "P2B-16 / P4-12 / P4-14 cross-library wall-time and peak-RSS harness. Manual; not invoked by cargo test."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "psutil>=6.0",
    "scikit-learn==1.6.1",
    "torch>=2.4",
    "gpytorch>=1.13",
    "GPy>=1.13",
    "matplotlib>=3.8",
]

[tool.uv]
package = false
